[project]
name = "beetector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["ultralytics", "boxmot", "opencv-python", "numpy", "pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beetector"]

[tool.ruff]
line-length = 100
